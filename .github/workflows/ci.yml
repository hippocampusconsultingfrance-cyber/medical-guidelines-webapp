name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      # Valeurs publiques (clé publishable) : le build n'appelle pas Supabase,
      # mais le proxy et les pages en ont besoin pour se compiler.
      NEXT_PUBLIC_SUPABASE_URL: https://gafoerloysumhzccvgdm.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_pqCucpEBy4xgVDnlx-_EwA_T2cKXWPw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dépendances de production : aucune vulnérabilité connue de gravité
      # élevée ou critique n'est acceptée.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Règles du parcours membre (crédits, PREMIUM, spécialité, publication),
  # appliquées par la base : base PostgreSQL 17 vide, schéma, migrations et
  # contenu, puis scénario tests/base/parcours.sql.
  parcours-membre:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: tests/base/lancer.sh postgres://postgres:test@localhost:5432/postgres
