name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      # Valeurs publiques (clé publishable) : le build n'appelle pas Supabase,
      # mais le proxy et les pages en ont besoin pour se compiler.
      NEXT_PUBLIC_SUPABASE_URL: https://gafoerloysumhzccvgdm.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_pqCucpEBy4xgVDnlx-_EwA_T2cKXWPw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
