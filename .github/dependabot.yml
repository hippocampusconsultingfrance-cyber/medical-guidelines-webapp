# Mises à jour automatiques des dépendances (sécurité) : une proposition
# groupée par mois, vérifiée par la CI avant toute mise en ligne.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Versions majeures (changements incompatibles) : mises à jour à la main.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dependances:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
